<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>
  {% include nav.html %}
  <main>
    {{ content }}
  </main>

  <script src="{{ '/assets/js/reveal.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/counters.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/charts.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/gallery.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/copy.js' | relative_url }}"></script>
</body>
</html>
