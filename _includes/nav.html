<!-- Sticky top navigation. Anchor links map to section ids in index.html. -->
<header class="nav" id="nav">
  <div class="nav__inner">
    <a class="nav__brand" href="#top">
      <span class="nav__dot" aria-hidden="true"></span>
      {{ site.title }}
    </a>

    <button class="nav__toggle" aria-label="Toggle menu" aria-expanded="false" id="navToggle">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav__links" id="navLinks">
      <a href="#overview">Overview</a>
      <a href="#examples">Examples</a>
      <a href="#taxonomy">Taxonomy</a>
      <a href="#method">Method</a>
      <a href="#results">Results</a>
      <a href="#cite">Cite</a>
      {% if site.links.arxiv != "" %}
        <a class="btn btn--primary nav__cta" href="{{ site.links.arxiv }}" target="_blank" rel="noopener">
          arXiv <span aria-hidden="true">↗</span>
        </a>
      {% endif %}
    </nav>
  </div>
</header>
