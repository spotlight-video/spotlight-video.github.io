<!-- Results: the dark "spotlight" band with the headline finding + two charts. -->
<section class="section section--dark" id="results">
  <div class="wrap">
    <div class="section__head reveal">
      <p class="eyebrow eyebrow--gold">Key result</p>
      <h2 class="section__title">Humans still beat the best VLMs by nearly 2×</h2>
      <p class="prose prose--center prose--invert">
        Across both metrics, the strongest baselines fall far short of human annotators at
        localizing and explaining errors.
      </p>
    </div>

    <!-- Two metrics shown side by side -->
    <div class="results-grid reveal">
      <div class="chart-card chart-card--dark">
        <div class="chart-card__head">
          <h3 class="chart-card__title">Score (S+P)</h3>
          <p class="chart-card__formula">M(E, Ê)</p>
        </div>
        <div class="chart-box chart-box--tall"><canvas id="chartScore" aria-label="Bar chart of Score (S+P) by method" role="img"></canvas></div>
      </div>

      <div class="chart-card chart-card--dark">
        <div class="chart-card__head">
          <h3 class="chart-card__title">%GT (S+P)</h3>
          <p class="chart-card__formula">M%(E, Ê)</p>
        </div>
        <div class="chart-box chart-box--tall"><canvas id="chartGT" aria-label="Bar chart of %GT (S+P) by method" role="img"></canvas></div>
      </div>
    </div>
  </div>
</section>
