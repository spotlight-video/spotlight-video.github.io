<footer class="footer">
  <div class="wrap footer__inner">
    <p class="footer__brand">{{ site.title }} <span>· {{ site.conference }}</span></p>
    <p class="footer__affil">
      {% for aff in site.data.authors.affiliations %}{{ aff }}{% unless forloop.last %} · {% endunless %}{% endfor %}
    </p>
    <p class="footer__links">
      {% if site.links.arxiv != "" %}<a href="{{ site.links.arxiv }}" target="_blank" rel="noopener">arXiv</a>{% endif %}
      {% if site.links.data != "" %}<a href="{{ site.links.data }}" target="_blank" rel="noopener">Dataset</a>{% endif %}
    </p>
  </div>
</footer>
